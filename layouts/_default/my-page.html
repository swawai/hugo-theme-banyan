{{ define "styles" }}
{{ partial "head-styles.html" (dict "ctx" . "variant" "name") }}
{{ end }}
{{ define "head-extra" }}
{{ partial "article/styles.html" (dict "ctx" .) }}
{{ partial "system/styles.html" . }}
{{ end }}

{{ define "main" }}
<article class="article system-page" data-system-page>
  <div class="collection-list collection-list--index">
    <h1 class="collection-list-header">{{ .Title }}</h1>
    <div class="prose">{{ .Content }}</div>
  </div>
</article>
{{ end }}
