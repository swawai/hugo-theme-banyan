{{- $text := .text | default "" -}}
{{- $icon := .icon | default "file" -}}
<span class="collection-item-icon{{ if reflect.IsMap $icon }} collection-item-icon--text{{ end }}"{{ if reflect.IsMap $icon }} aria-hidden="true"{{ end }}>
  {{- partial "icon" (dict "name" $icon "class" (cond (reflect.IsMap $icon) "" "collection-item-icon-svg")) -}}
</span>
<span class="collection-item-title">{{ $text }}</span>
