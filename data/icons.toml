# ==============================================================================
# Icon Management Architecture (JIT Sprite)
# ==============================================================================
# 本库为整个系统所有 SVG 图标的唯一且绝对的数据源。
# 遵循“声明式架构”，无需任何中间打包层。
#
# 【引入规范】
# 1. 在 Bundle/Markdown 内容页中，请统一使用短代码：
#    {{< icon "folder" >}}
#    可以带参数：{{< icon "folder" class="my-class" label="我的文件夹" >}}
#
# 2. 在 Layouts 模板区域 (.html) 中，请统一调用 partial：
#    {{ partial "icon" (dict "name" "folder") }}
#
# 【运行原理 (JIT 按需 Sprite)】
# 无论是在哪一种场景引入，系统底层都只会输出一个指向对应 ID 的极简 `<use href="#icon-xxx">`。
# 同时，引擎会在你渲染的生命周期中利用 `page.Store` 全局记忆账单，记录你使用了哪些图标。
# 最后在 `baseof.html` 闭合前，统一汇总该页真正使用的唯一去重图标，只把用到的对应
# viewBox 和 body 在页面最底部懒打包成局部 Sprite 图集。
# 这保证了没有任何多余的图标字节被客户端请求到，而且规避了巨量循环列表下的 DOM 体积膨胀。
# ==============================================================================

[file]
viewBox = "0 0 24 24"
body = '<path fill="var(--focus)" d="M3 1h12.414L21 6.586V23H3V1Zm2 2v18h14V9h-6V3H5Zm10 .414V7h3.586L15 3.414Z"/>'

